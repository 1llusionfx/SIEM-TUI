[project]
name = "loganalyzer"
version = "0.1.0"
description = "Parse security logs and store events in SQLite"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2,<3"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "core"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[tool.mypy]
strict = true
files = ["core", "tests"]

[tool.ruff]
src = ["core"]

[tool.ruff.lint]
extend-select = ["I"]
